name: Desktop installers

# Builds DCrux for Windows (.msi) and Linux (.deb and .tar.gz) and attaches them to a release.
# Started by hand for an existing release tag (Actions → Desktop installers → Run workflow). It needs the
# repository secrets DCRUX_PROXY_URL and DCRUX_APP_SECRET and stops at once without them.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the installers to (for example v1.4.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb
          - os: windows-latest
            task: packageMsi packageExe
    runs-on: ${{ matrix.os }}
    env:
      # Leaves the Android app out of the build, so no Android SDK is needed here.
      DCRUX_DESKTOP_ONLY: "1"
      DCRUX_PROXY_URL: ${{ secrets.DCRUX_PROXY_URL }}
      DCRUX_APP_SECRET: ${{ secrets.DCRUX_APP_SECRET }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Without the service's address and signing secret the app could not reach the AI or sync, so no installer is made.
      - name: Check the build settings are present
        shell: bash
        run: |
          if [ -z "$DCRUX_PROXY_URL" ] || [ -z "$DCRUX_APP_SECRET" ]; then
            echo "DCRUX_PROXY_URL and DCRUX_APP_SECRET must be set as repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Build the app with its own Java runtime
        shell: bash
        run: ./gradlew :desktop:createDistributable --no-daemon

      # The packaged app is run without a window: it must open its database and settings and draw its
      # first screen with the runtime it ships with. The picture is kept with the run.
      - name: Check that the packaged app starts
        shell: bash
        run: |
          APP=desktop/build/compose/binaries/main/app
          cp -r "$APP/DCrux" smoke
          CFG=$(find smoke -name DCrux.cfg | head -1)
          sed -i 's/app.mainclass=app.dcrux.desktop.MainKt/app.mainclass=app.dcrux.desktop.RenderKt/' "$CFG"
          sed -i 's/\[JavaOptions\]/[JavaOptions]\njava-options=-Djava.awt.headless=true/' "$CFG"
          EXE=$(find smoke -maxdepth 2 \( -name DCrux.exe -o -path '*/bin/DCrux' \) | head -1)
          mkdir -p smoke-data smoke-out
          "$EXE" "$PWD/smoke-data" "$PWD/smoke-out" nosync wait:2500 first || true
          sleep 5
          ls -la smoke-out smoke-data
          test -s smoke-out/first.png
          test -s smoke-data/dcrux.db

      - uses: actions/upload-artifact@v4
        with:
          name: first-screen-${{ runner.os }}
          path: smoke-out/first.png

      # After its first start the app writes itself a class archive, which later starts load from (StartArchive.kt).
      # Here that same step is run by hand on this system, and the app is then started with the archive made
      # compulsory. It reports; it does not stop a release, because the app works without the archive too.
      - name: Check the class archive can be written and used
        shell: bash
        continue-on-error: true
        run: |
          EXE=$(find smoke -maxdepth 2 \( -name DCrux.exe -o -path '*/bin/DCrux' \) | head -1)
          RES=$(dirname "$(find smoke -name classes.lst | head -1)")
          LIST="$PWD/$RES/classes.lst"
          if [ "$RUNNER_OS" = "Windows" ]; then LIST=$(cygpath -w "$LIST"); fi
          JAVA_TOOL_OPTIONS="-Xshare:dump -XX:SharedClassListFile=\"$LIST\"" "$EXE" > archive.log 2>&1 || true
          for i in $(seq 1 90); do [ -s "$RES/dcrux.jsa" ] && break; sleep 2; done
          sleep 3
          ls -la "$RES"
          tail -3 archive.log || true
          test -s "$RES/dcrux.jsa"
          mkdir -p smoke-out2
          JAVA_TOOL_OPTIONS="-Xshare:on" "$EXE" "$PWD/smoke-data" "$PWD/smoke-out2" nosync wait:1500 again || true
          sleep 5
          test -s smoke-out2/again.png
          echo "Class archive: written and in use on $RUNNER_OS"

      - name: Make the installer
        shell: bash
        run: for t in ${{ matrix.task }}; do ./gradlew ":desktop:$t" --no-daemon; done

      - name: Collect the files
        shell: bash
        run: |
          V="${TAG#v}"
          mkdir out
          find desktop/build/compose/binaries -name '*.deb' -exec cp {} "out/DCrux-$V-linux-x64.deb" \;
          find desktop/build/compose/binaries -name '*.msi' -exec cp {} "out/DCrux-$V-windows-x64.msi" \;
          find desktop/build/compose/binaries -name '*.exe' -path '*main/exe*' -exec cp {} "out/DCrux-$V-windows-x64-setup.exe" \;
          if [ "$RUNNER_OS" = "Linux" ]; then tar -C desktop/build/compose/binaries/main/app -czf "out/DCrux-$V-linux-x64.tar.gz" DCrux; fi
          ls -la out

      - name: Attach them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber
